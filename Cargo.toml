[workspace]
resolver = "2"
members = ["tonnetz-core", "tonnetz-sound", "tonnetz-midi", "tonnetz-cli"]

[workspace.dependencies]
rand = "0.10.2"
rustysynth = "1.3.6"
cpal = "0.18.2"
hound = "3.5.1"
midly = "0.5.3"
tonnetz-core = { path = "tonnetz-core" }
tonnetz-sound = { path = "tonnetz-sound" }
tonnetz-midi = { path = "tonnetz-midi" }
